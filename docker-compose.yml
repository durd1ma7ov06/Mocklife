version: '3.8'

services:
  # 1. PostgreSQL Database Service (AWS RDS bo'lmagan holatda yoki EC2 da mahalliy ishlatish uchun)
  postgres:
    image: postgres:16-alpine
    container_name: mocklife_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mocklife_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mocklife_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mocklife_db}
    ports:
      - "5432:5432"
    volumes:
      - mocklife_pgdata:/var/lib/postgresql/data
      - ./IELTIX_platform/backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mocklife_user} -d ${POSTGRES_DB:-mocklife_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MockLife Backend API Service
  backend:
    build:
      context: ./IELTIX_platform/backend
      dockerfile: Dockerfile
    container_name: mocklife_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:5173,https://mocklife.uz}
      JWT_SECRET: ${JWT_SECRET:-mocklife_jwt_production_secret_2026_aws}
      # AWS RDS ishlatilganda ushbu qatorga RDS ulanish havolasi qo'yiladi
      DATABASE_URL: ${DATABASE_URL:-postgresql://mocklife_user:mocklife_secure_pass_2026@postgres:5432/mocklife_db}
      DB_SSL: ${DB_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. MockLife Frontend Web App
  frontend:
    build:
      context: ./IELTIX_platform/frontend
      dockerfile: Dockerfile
    container_name: mocklife_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mocklife_pgdata:
    driver: local
