# ==============================================================================
# IELTIX Platform - AWS Production Docker Compose
# Orchestrates: Postgres 16, Redis 7, FastAPI Core API, Telegram Bot,
# Frontend Web App (React/Vite), and Nginx Reverse Proxy.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ieltix-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ieltix}
      POSTGRES_USER: ${POSTGRES_USER:-ieltix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ieltix_secret_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ieltix_user} -d ${POSTGRES_DB:-ieltix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ieltix-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    build:
      context: ../../
      dockerfile: Dockerfile.core-api
    container_name: ieltix-core-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env.bot
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ieltix_user}:${POSTGRES_PASSWORD:-ieltix_secret_123}@postgres:5432/${POSTGRES_DB:-ieltix}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../../apps:/app/apps
      - ../../packages:/app/packages
    expose:
      - "8000"

  bot:
    build:
      context: ../../
      dockerfile: Dockerfile.bot
    container_name: ieltix-bot
    restart: always
    depends_on:
      core-api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env.bot
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ieltix_user}:${POSTGRES_PASSWORD:-ieltix_secret_123}@postgres:5432/${POSTGRES_DB:-ieltix}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../../apps:/app/apps
      - ../../packages:/app/packages

  backend:
    build:
      context: ../../IELTIX_platform/backend
      dockerfile: Dockerfile
    container_name: ieltix-backend
    restart: always
    env_file:
      - ../../.env.bot
    environment:
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: "*"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ieltix_user}:${POSTGRES_PASSWORD:-ieltix_secret_123}@postgres:5432/${POSTGRES_DB:-ieltix}
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../IELTIX_platform/frontend
      dockerfile: Dockerfile
    container_name: ieltix-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: ieltix-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - core-api
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:
