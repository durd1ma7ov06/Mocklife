# ==============================================================================
# IELTIX Production Nginx Configuration (AWS EC2 / Lightsail)
# ==============================================================================

upstream core_api_upstream {
    server core-api:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Core FastAPI Reverse Proxy
    location /api/ {
        proxy_pass http://core_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Core API docs & health endpoints
    location /docs {
        proxy_pass http://core_api_upstream/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://core_api_upstream/openapi.json;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://core_api_upstream/health;
        proxy_set_header Host $host;
    }

    # Frontend Web Application (React / Vite)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
