[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ieltix-bot-platform"
version = "0.1.0"
description = "Telegram-first IELTS practice and bilingual Live Call platform"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "edge-tts>=6.1,<8",
  "fastapi>=0.115,<1",
  "groq>=0.11,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "redis>=5.1,<6",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.31,<1",
]

[project.optional-dependencies]
voice = ["edge-tts>=6.1,<8", "groq>=0.11,<1"]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
